<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5F3F7">
<title>你像哪个历史人物？</title>
<style>
:root {
  --bg: #F5F3F7;
  --bg-cream: #FAF9FC;
  --card: #FFFFFF;
  --purple: #7B74B4;
  --purple-deep: #5A5490;
  --purple-dark: #2D2D5A;
  --purple-soft: #E8E4F0;
  --purple-lighter: #F0EDF5;
  --purple-border: #D4CFE8;
  --text: #333340;
  --text-muted: #6B6B7B;
  --text-light: #9999A8;
  --accent-red: #E85A71;
  --bar: #8B84C0;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  line-height: 1.6;
}
body { max-width: 430px; margin: 0 auto; position: relative; min-height: 100dvh; }

.screen { display: none; min-height: 100dvh; flex-direction: column; }
.screen.active { display: flex; }

/* ===== START ===== */
#start {
  background: linear-gradient(180deg, #F8F6FB 0%, #EFEAF8 50%, #F5F3F7 100%);
  padding: 48px 24px 32px;
  align-items: center;
  text-align: center;
  justify-content: center;
}
.start-icon {
  width: 72px; height: 72px;
  background: var(--purple-soft);
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; margin-bottom: 28px;
  box-shadow: 0 4px 16px rgba(123,116,180,0.15);
}
.start-label {
  font-size: 13px; color: var(--purple);
  letter-spacing: 2px; margin-bottom: 12px;
}
.start-title {
  font-size: 32px; font-weight: 700; color: var(--purple-dark);
  line-height: 1.3; margin-bottom: 8px;
}
.start-title .hl {
  background: linear-gradient(120deg, #FFE8A3 0%, #FFE8A3 100%);
  background-size: 100% 40%;
  background-repeat: no-repeat;
  background-position: 0 85%;
  padding: 0 2px;
}
.start-illus {
  width: 160px; height: 100px;
  margin: 24px auto;
  background: var(--purple-lighter);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  gap: 12px; font-size: 42px;
}
.start-desc {
  font-size: 14px; color: var(--text-muted);
  margin: 8px 0 28px; max-width: 280px;
}
.start-tags {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin-bottom: 36px;
}
.pill {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 20px;
  background: var(--purple-lighter);
  color: var(--purple-deep);
  font-size: 12px;
}
.btn-primary {
  width: 100%; max-width: 300px;
  padding: 16px 32px;
  border: none; border-radius: 28px;
  background: linear-gradient(135deg, #8B84C0, #6B64A8);
  color: #fff; font-size: 17px; font-weight: 600;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(107,100,168,0.35);
  transition: transform 0.15s, box-shadow 0.15s;
  font-family: inherit;
}
.btn-primary:active { transform: scale(0.97); }
.start-hint {
  margin-top: 20px; font-size: 12px; color: var(--text-light);
}

/* ===== QUIZ ===== */
#quiz {
  background: var(--bg);
  padding: 0 0 var(--safe-bottom);
}
.quiz-header {
  padding: 16px 20px 12px;
  background: var(--card);
  border-bottom: 1px solid var(--purple-border);
  position: sticky; top: 0; z-index: 10;
}
.quiz-progress-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.quiz-progress-text { font-size: 13px; color: var(--purple); font-weight: 500; }
.quiz-back {
  background: none; border: none; color: var(--text-muted);
  font-size: 14px; cursor: pointer; padding: 4px 0; font-family: inherit;
}
.progress-bar-track {
  height: 4px; background: var(--purple-soft); border-radius: 2px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; background: linear-gradient(90deg, #8B84C0, #6B64A8);
  border-radius: 2px; transition: width 0.3s ease;
}
.quiz-body { padding: 28px 20px 24px; flex: 1; }
.q-number {
  font-size: 12px; color: var(--purple); font-weight: 600;
  letter-spacing: 1px; margin-bottom: 10px;
}
.q-text {
  font-size: 20px; font-weight: 600; color: var(--purple-dark);
  line-height: 1.45; margin-bottom: 28px;
}
.options { display: flex; flex-direction: column; gap: 12px; }
.option {
  padding: 16px 18px;
  background: var(--card);
  border: 1.5px solid var(--purple-border);
  border-radius: 14px;
  font-size: 15px; color: var(--text);
  cursor: pointer; text-align: left;
  transition: all 0.2s;
  font-family: inherit; line-height: 1.5;
  box-shadow: 0 1px 4px rgba(123,116,180,0.06);
}
.option:active, .option.selected {
  border-color: var(--purple);
  background: var(--purple-lighter);
  color: var(--purple-deep);
  transform: scale(0.985);
}

/* ===== RESULT ===== */
#result {
  background: var(--bg);
  padding-bottom: calc(80px + var(--safe-bottom));
}
.result-top {
  padding: 14px 16px;
  background: var(--card);
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--purple-border);
  position: sticky; top: 0; z-index: 10;
}
.result-top-label { font-size: 14px; color: var(--purple-dark); font-weight: 600; }
.result-slide-ind { font-size: 12px; color: var(--text-light); }

/* Swipe container */
.slides-wrap {
  width: 100%;
  overflow: hidden;
  touch-action: pan-y;
  position: relative;
}
.slides {
  display: flex;
  width: 100%;
  transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
  will-change: transform;
}
.slide {
  box-sizing: border-box;
  width: 100%;
  flex: 0 0 100%;
  padding: 20px 16px 16px;
  min-height: 1px;
}

.card {
  background: var(--card);
  border-radius: 16px;
  border: 1px solid var(--purple-border);
  padding: 22px 18px;
  margin-bottom: 14px;
  box-shadow: 0 2px 12px rgba(123,116,180,0.08);
}
.card-section-title {
  font-size: 15px; font-weight: 700; color: var(--purple-dark);
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 6px;
}
.card-section-title .num {
  color: var(--purple); font-size: 14px;
}

/* Slide 1 match */
.match-label {
  font-size: 13px; color: var(--purple); text-align: center; margin-bottom: 8px;
}
.match-icon {
  text-align: center; font-size: 28px; margin-bottom: 4px; opacity: 0.7;
}
.match-pct {
  font-size: 56px; font-weight: 700; color: #7B74B4;
  text-align: center; line-height: 1.15; letter-spacing: -1px;
  font-variant-numeric: tabular-nums;
}
.match-name {
  font-size: 28px; font-weight: 700; color: #2D2D5A;
  text-align: center; margin: 6px 0 4px;
}
.match-sub {
  font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 16px;
}
.tag-row {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px;
}
.tag {
  padding: 5px 14px; border-radius: 20px;
  background: var(--purple-lighter); color: var(--purple-deep);
  font-size: 13px; font-weight: 500;
}
.dom-dim {
  display: block; text-align: center;
  margin: 0 auto 18px; width: fit-content;
  padding: 6px 18px; border-radius: 20px;
  background: var(--purple-soft); color: var(--purple-deep);
  font-size: 13px; font-weight: 600;
}
.quote-box {
  background: var(--purple-lighter);
  border-radius: 12px;
  padding: 14px 16px;
}
.quote-label {
  font-size: 12px; color: var(--purple); font-weight: 600; margin-bottom: 6px;
}
.quote-text {
  font-size: 15px; color: var(--purple-dark); font-weight: 500;
  line-height: 1.55;
}

/* Narrative footer on slides */
.hist-footer {
  margin-top: 8px; padding: 16px 4px 8px;
}
.hist-footer h3 {
  font-size: 15px; font-weight: 700; color: var(--purple-dark);
  margin-bottom: 10px; line-height: 1.4;
}
.hist-footer p {
  font-size: 13px; color: var(--text-muted); line-height: 1.75;
}

/* Bars */
.bar-row {
  display: flex; align-items: center; margin-bottom: 12px; gap: 10px;
}
.bar-label {
  width: 36px; flex-shrink: 0;
  font-size: 13px; color: var(--text); font-weight: 500;
}
.bar-track {
  flex: 1; height: 10px; background: var(--purple-soft);
  border-radius: 5px; overflow: hidden;
}
.bar-fill {
  height: 100%; background: var(--bar); border-radius: 5px;
  width: 0; transition: width 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.bar-score {
  width: 28px; text-align: right;
  font-size: 13px; color: var(--purple); font-weight: 600;
}

/* Commonality */
.trait-card {
  background: var(--bg-cream);
  border: 1px solid var(--purple-border);
  border-radius: 12px;
  padding: 14px 14px;
  margin-bottom: 10px;
}
.trait-title {
  font-size: 14px; font-weight: 700; color: var(--purple-dark); margin-bottom: 6px;
}
.trait-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

/* Blind spot / advice */
.warn-card, .advice-card {
  border-radius: 12px; padding: 14px; margin-bottom: 10px;
  border: 1px solid var(--purple-border);
}
.warn-card { background: #F8F4FC; }
.advice-card { background: #F4F6FC; }
.warn-title, .advice-title {
  font-size: 13px; font-weight: 700; color: var(--purple-deep); margin-bottom: 6px;
}
.warn-body, .advice-body { font-size: 13px; color: var(--text-muted); line-height: 1.65; }

/* Quotes speech bubbles */
.speech {
  background: var(--purple-lighter);
  border-radius: 14px 14px 14px 4px;
  padding: 12px 14px;
  margin-bottom: 10px;
  font-size: 14px; color: var(--purple-dark); font-weight: 500;
  position: relative;
}
.speech::before {
  content: '"';
  color: var(--purple); font-size: 20px; font-weight: 700;
  margin-right: 2px; opacity: 0.5;
}

/* Dots */
.dots {
  display: flex; justify-content: center; gap: 7px;
  padding: 8px 0 12px;
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--purple-border);
  transition: all 0.25s;
}
.dot.active {
  background: var(--accent-red);
  width: 18px; border-radius: 4px;
}

/* Bottom bar */
.result-actions {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  padding: 12px 16px calc(12px + var(--safe-bottom));
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--purple-border);
  display: flex; gap: 10px; z-index: 20;
}
.btn-outline {
  flex: 1; padding: 13px;
  border: 1.5px solid var(--purple);
  border-radius: 24px;
  background: transparent; color: var(--purple-deep);
  font-size: 15px; font-weight: 600; cursor: pointer;
  font-family: inherit;
}
.btn-outline:active { background: var(--purple-lighter); }
.btn-share {
  flex: 1.2; padding: 13px;
  border: none; border-radius: 24px;
  background: linear-gradient(135deg, #8B84C0, #6B64A8);
  color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  font-family: inherit;
  box-shadow: 0 4px 14px rgba(107,100,168,0.3);
}
.btn-share:active { opacity: 0.9; }

.swipe-hint {
  text-align: center; font-size: 12px; color: var(--text-light);
  padding: 0 0 4px;
}

/* Loading */
#loading {
  align-items: center; justify-content: center;
  background: var(--bg); text-align: center; padding: 40px;
}
.loader {
  width: 40px; height: 40px;
  border: 3px solid var(--purple-soft);
  border-top-color: var(--purple);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 15px; color: var(--purple-deep); font-weight: 500; }
.loading-sub { font-size: 13px; color: var(--text-light); margin-top: 8px; }

/* Toast */
.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: rgba(45,45,90,0.9); color: #fff;
  padding: 10px 20px; border-radius: 20px;
  font-size: 13px; z-index: 100; opacity: 0;
  transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }
.share-ov{position:fixed;inset:0;background:rgba(30,28,60,.88);z-index:200;display:none;flex-direction:column;align-items:center;padding:16px 16px calc(16px + var(--safe-bottom));overflow-y:auto}
.share-ov.show{display:flex}
.share-ov img{width:100%;max-width:400px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.share-hint{color:#fff;font-size:14px;margin:12px 0 10px}
.share-btns{display:flex;gap:10px;width:100%;max-width:400px;margin-bottom:8px}
.share-btns button{flex:1;padding:12px;border-radius:22px;border:none;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.sb-dl{background:#fff;color:#5A5490}.sb-close{background:rgba(255,255,255,.18);color:#fff}

/* access code modal */
.code-mask{position:fixed;inset:0;background:rgba(40,36,60,.45);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
.code-mask.show{display:flex}
.code-panel-wrap{position:relative;width:100%;max-width:340px}
.code-panel{width:100%;background:#fff;border-radius:20px;padding:24px 20px 20px;box-shadow:0 12px 40px rgba(60,50,110,.2);text-align:center}
.code-panel h3{font-size:18px;color:#333340;margin-bottom:16px;font-weight:700}
.code-panel input{width:100%;box-sizing:border-box;padding:14px 16px;border:1.5px solid #DDD8EC;border-radius:14px;font-size:16px;font-family:inherit;color:#333340;background:#F5F3F7;outline:none;text-align:center;letter-spacing:1px}
.code-panel input:focus{border-color:#7B74B4;background:#fff}
.code-panel .btn-primary{margin-top:14px;width:100%;max-width:none}
.code-hint{margin-top:12px;font-size:12px;color:#8A8798;line-height:1.5}
.code-close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:22px;color:#8A8798;cursor:pointer;line-height:1;font-family:inherit;padding:4px}
</style>
</head>
<body>

<!-- START -->
<section id="start" class="screen active">
  <div class="start-icon">🏛️</div>
  <div class="start-label">历史人物匹配</div>
  <h1 class="start-title">你像哪个<br><span class="hl">历史人物</span>？</h1>
  <div class="start-illus"><span>📜</span><span>⚔️</span><span>🪶</span></div>
  <p class="start-desc">趣味测试，了解自己的历史人物原型<br>通过性格维度匹配千古人物底色</p>
  <div class="start-tags">
    <span class="pill">8 维能力画像</span>
    <span class="pill">6 位历史人物</span>
    <span class="pill">约 2 分钟</span>
  </div>
  <button class="btn-primary" id="btnStart">开始测试</button>
  <p class="start-hint">共 10 道题 · 单选 · 结果可左右滑动查看</p>
</section>

<!-- QUIZ -->
<section id="quiz" class="screen">
  <div class="quiz-header">
    <div class="quiz-progress-row">
      <button class="quiz-back" id="btnQuizBack">← 上一题</button>
      <span class="quiz-progress-text" id="quizProgress">1 / 10</span>
    </div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill" style="width:10%"></div>
    </div>
  </div>
  <div class="quiz-body">
    <div class="q-number" id="qNumber">QUESTION 01</div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="options"></div>
  </div>
</section>

<!-- LOADING -->
<section id="loading" class="screen">
  <div class="loader"></div>
  <div class="loading-text">正在匹配历史人物…</div>
  <div class="loading-sub">分析你的性格底色与决策风格</div>
</section>

<!-- RESULT -->
<section id="result" class="screen">
  <div class="result-top">
    <span class="result-top-label">你的历史人物匹配结果</span>
    <span class="result-slide-ind" id="slideInd">1 / 6</span>
  </div>
  <div class="slides-wrap" id="slidesWrap">
    <div class="slides" id="slides">
      <!-- slides injected by JS -->
    </div>
  </div>
  <p class="swipe-hint">← 左右滑动查看完整结果 →</p>
  <div class="dots" id="dots"></div>
  <div class="result-actions">
    <button class="btn-outline" id="btnRetry">再测一次</button>
    <button class="btn-share" id="btnShare">复制文案</button>
    <button class="btn-share" id="btnImg">生成分享图</button>
  </div>
</section>

<div class="share-ov" id="shareOv">
  <div class="share-hint">长按图片保存，或点击下载</div>
  <img id="shareImg" alt="分享图">
  <div class="share-btns" style="margin-top:12px"><button class="sb-dl" id="btnDl">下载</button><button class="sb-close" id="btnClose">关闭</button></div>
</div>
<div class="code-mask" id="codeMask" aria-hidden="true">
  <div class="code-panel-wrap">
    <div class="code-panel">
      <button type="button" class="code-close" id="codeClose" aria-label="关闭">×</button>
      <h3>输入测试验证码</h3>
      <input type="text" id="codeInput" placeholder="请输入验证码" autocomplete="off" autocapitalize="characters" maxlength="32">
      <button type="button" class="btn-primary" id="btnCodeOk">开始答题</button>
      <p class="code-hint">购买后客服会发给你验证码<br>每个码限用 3 次 · 同设备本页刷新内可重测</p>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ========== DIMENSIONS ========== */
const DIMS = ['决断','共情','开创','洞察','表达','经营','独立','担当'];

/* ========== FIGURES ========== */
const FIGURES = [
  {
    id: 'zhugeliang',
    name: '诸葛亮',

    dominant: '决断',
    quote: '真正的谋划，是把责任坚持到最后。',
    portrait: '你与诸葛亮相似的，并不是具体经历，而是处理世界的方式。你很少被表面热闹牵着走，善于从碎片里识别规律，把眼前得失放进更长的时间轴，再选择最有杠杆的一步。',
    base: { 决断:98, 共情:38, 开创:38, 洞察:98, 表达:68, 经营:98, 独立:68, 担当:38 },
    common: [
      { title: '第一底色 · 决断', desc: '需要拍板时，你倾向滤掉噪声、抓住主线。这是你与诸葛亮最接近的一层性格。' },
      { title: '隐藏天赋 · 洞察', desc: '你相信真正的答案藏在表象背后的规律里。这是你与他高度重合的另一面。' },
      { title: '长期优势 · 经营', desc: '你看得见资源如何组合、如何产生长期价值。这也是你们共同的底色。' }
    ],
    realLife: '在现实里，你常常是局面中的观察者与设计者，习惯提前准备 Plan B。',
    blindSpot: '想得太深时，可能错过快速行动的窗口。',
    risk: '当「洞察」被过度使用，你可能把它变成唯一答案。压力之下，记得检查自己是否忽略了关系、节奏或新证据。',
    advice: '好策略需要落地；信息足够时，允许自己果断下注。',
    lines: [
      '真正的谋划，是把责任坚持到最后。',
      '别只看眼前这一手。',
      '信息不全时，克制也是行动。'
    ],
    closing: '你是天生的慢决策者。别人凭直觉下判断时，你更想先推演所有可能的方向；别人很快熟络，你却要用时间确认对方是否值得信任；你也很难假装看不见自己不认同的事。'
  },
  {
    id: 'wuzetian',

/* ========== STATE ========== */
let answers = []; // index of selected option per question
let qIndex = 0;
let resultFigure = null;
let matchPct = 0;

let touchStartX = 0;
let touchStartY = 0;
let touchDeltaX = 0;

/* ========== SCREENS ========== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

/* ========== QUIZ ========== */
function startQuiz() {
  answers = [];
  qIndex = 0;
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[qIndex];
  const total = QUESTIONS.length;
  document.getElementById('quizProgress').textContent = `${qIndex + 1} / ${total}`;
  document.getElementById('progressFill').style.width = `${((qIndex + 1) / total) * 100}%`;
  document.getElementById('qNumber').textContent = `QUESTION ${String(qIndex + 1).padStart(2, '0')}`;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('btnQuizBack').style.visibility = qIndex === 0 ? 'hidden' : 'visible';

  const box = document.getElementById('options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt.text;
    if (answers[qIndex] === i) btn.classList.add('selected');
    btn.addEventListener('click', () => selectOption(i));
    box.appendChild(btn);
  });
}

function selectOption(i) {
  answers[qIndex] = i;
  document.querySelectorAll('.option').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
  setTimeout(() => {
    if (qIndex < QUESTIONS.length - 1) {
      qIndex++;
      renderQuestion();
    } else {
      finishQuiz();
    }
  }, 220);
}

function quizBack() {
  if (qIndex > 0) {
    qIndex--;
    renderQuestion();
  }
}

/* ========== SCORING ========== */
function finishQuiz() {
  showScreen('loading');
  setTimeout(() => {
    computeResult();
    renderResult();
    showScreen('result');
  }, 1400);
}

function computeResult() {
  userScores = {};
  DIMS.forEach(d => userScores[d] = 0);

  QUESTIONS.forEach((q, qi) => {
    const opt = q.options[answers[qi]];
    if (!opt) return;
    Object.entries(opt.scores).forEach(([dim, w]) => {
      userScores[dim] = (userScores[dim] || 0) + w;
    });
  });

  // Normalize user scores to 0-100-ish for comparison
  const maxU = Math.max(...DIMS.map(d => userScores[d]), 1);
  const normUser = {};
  DIMS.forEach(d => {
    normUser[d] = (userScores[d] / maxU) * 100;
  });

  // Score each figure by similarity (weighted cosine-ish / distance)
  let best = null;
  let bestSim = -1;
  FIGURES.forEach(fig => {
    let dot = 0, n1 = 0, n2 = 0;
    DIMS.forEach(d => {
      const a = normUser[d];
      const b = fig.base[d];
      // Extra weight on top user dims
      const w = a > 60 ? 1.4 : 1;
      dot += w * a * b;
      n1 += w * a * a;
      n2 += w * b * b;
    });
    const sim = dot / (Math.sqrt(n1) * Math.sqrt(n2) + 1e-6);
    if (sim > bestSim) {
      bestSim = sim;
      best = fig;
    }
  });

  resultFigure = best;
  // Map similarity to 75-98
  matchPct = Math.round(75 + (bestSim - 0.7) * (23 / 0.3));
  matchPct = Math.max(75, Math.min(98, matchPct));

  // Derive display bars: blend figure base with user emphasis
  resultFigure.displayBars = {};
  DIMS.forEach(d => {
    const blend = resultFigure.base[d] * 0.72 + normUser[d] * 0.28;
    // slight jitter for authenticity, deterministic from scores
    const j = ((userScores[d] * 7 + d.length * 3) % 5) - 2;
    resultFigure.displayBars[d] = Math.max(30, Math.min(99, Math.round(blend + j)));
  });
}

function animateBars() {
  document.querySelectorAll('.bar-fill').forEach(el => {
    el.style.width = el.dataset.score + '%';
  });
}

function goSlide(i) {
  slideIndex = Math.max(0, Math.min(5, i));
  document.getElementById('slides').style.transform = `translateX(-${slideIndex * 100}%)`;
  document.getElementById('slideInd').textContent = `${slideIndex + 1} / 6`;
  document.querySelectorAll('.dot').forEach((d, idx) => {
    d.classList.toggle('active', idx === slideIndex);
  });
  if (slideIndex === 2) setTimeout(animateBars, 50);
}

/* Swipe */
function setupSwipe() {
  const wrap = document.getElementById('slidesWrap');
  wrap.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchDeltaX = 0;
  }, { passive: true });
  wrap.addEventListener('touchmove', e => {
    touchDeltaX = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (Math.abs(touchDeltaX) > Math.abs(dy) && Math.abs(touchDeltaX) > 8) {
      // horizontal intent — optional visual drag could be added
    }
  }, { passive: true });
  wrap.addEventListener('touchend', () => {
    if (touchDeltaX < -50) goSlide(slideIndex + 1);
    else if (touchDeltaX > 50) goSlide(slideIndex - 1);
    touchDeltaX = 0;
  });
  // Mouse drag for desktop
  let mouseDown = false, mx0 = 0;
  wrap.addEventListener('mousedown', e => { mouseDown = true; mx0 = e.clientX; });
  window.addEventListener('mouseup', e => {
    if (!mouseDown) return;
    mouseDown = false;
    const dx = e.clientX - mx0;
    if (dx < -50) goSlide(slideIndex + 1);
    else if (dx > 50) goSlide(slideIndex - 1);
  });
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function shareResult() {
  const f = resultFigure;
  const text = `我在「历史人物匹配」中测到：${f.name}（匹配度 ${matchPct}%）\n${f.subtitle}\n标签：${f.tags.join(' · ')}\n主导维度：${f.dominant}\n人物心声：「${f.quote}」\n——你也来测测自己像谁？`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast('结果文案已复制')).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('结果文案已复制'); }
  catch(e) { toast('复制失败，请手动截图分享'); }
  document.body.removeChild(ta);
}

/* ===== ACCESS CODE (limited-use via MantleDB) ===== */
const MANTLE_NS='catquiz-zph420-codes';
const MANTLE_KEY='f60c0dae2088e5ccd5061a110aef0c0ff2a5b85f2658e78809c9123c9d82a22c';
const MANTLE_BASE='https://mantledb.sh/v2/'+MANTLE_NS;
const ACCESS_KEY='hq_unlocked';
const ACCESS_CODE_KEY='hq_code';
function isUnlocked(){try{return sessionStorage.getItem(ACCESS_KEY)==='1'}catch(e){return false}}
function setUnlocked(code){
  try{
    sessionStorage.setItem(ACCESS_KEY,'1');
    if(code)sessionStorage.setItem(ACCESS_CODE_KEY,code);
  }catch(e){}
}
function normalizeCode(v){return String(v||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'')}
function openCodeModal(prefill){
  $('codeMask').classList.add('show');
  $('codeMask').setAttribute('aria-hidden','false');
  const inp=$('codeInput');
  if(prefill!=null)inp.value=prefill;else if(!inp.value)inp.value='';
  setTimeout(()=>inp.focus(),50);
}
function closeCodeModal(){
  $('codeMask').classList.remove('show');
  $('codeMask').setAttribute('aria-hidden','true');
}

function setCodeBusy(busy){
  const btn=$('btnCodeOk');
  btn.disabled=!!busy;
  btn.textContent=busy?'验证中…':'开始答题';
  btn.style.opacity=busy?'0.7':'1';
}
async function mantleGet(code){
  const r=await fetch(MANTLE_BASE+'/hq/'+encodeURIComponent(code),{
    headers:{'X-Mantle-Key':MANTLE_KEY}
  });
  if(r.status===404)return null;
  if(!r.ok)throw new Error('net '+r.status);
  return r.json();
}
async function mantleDecr(code){
  const r=await fetch('https://mantledb.sh/v2/increment/'+MANTLE_NS+'/hq/'+encodeURIComponent(code),{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Mantle-Key':MANTLE_KEY},
    body:JSON.stringify({key:'remaining',by:-1})
  });
  if(!r.ok)throw new Error('net '+r.status);
  return r.json();
}
async function mantleIncr(code){
  try{
    await fetch('https://mantledb.sh/v2/increment/'+MANTLE_NS+'/hq/'+encodeURIComponent(code),{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Mantle-Key':MANTLE_KEY},
      body:JSON.stringify({key:'remaining',by:1})
    });
  }catch(e){}
}
async function redeemCode(code){
  const data=await mantleGet(code);
  if(!data||typeof data.remaining!=='number'){
    return {ok:false,reason:'invalid'};
  }
  if(data.remaining<=0){
    return {ok:false,reason:'exhausted'};
  }
  const after=await mantleDecr(code);
  const left=typeof after.remaining==='number'?after.remaining:-1;
  if(left<0){
    await mantleIncr(code);
    return {ok:false,reason:'exhausted'};
  }
  return {ok:true,remaining:left,max:data.max||3};
}
async function tryUnlock(fromUrl){
  const code=normalizeCode($('codeInput').value);
  if(!code){if(!fromUrl)toast('请输入验证码');return false}
  setCodeBusy(true);
  try{
    const res=await redeemCode(code);
    if(res.ok){
      setUnlocked(code);
      const left=res.remaining;
      toast(left>0?('验证成功，还可以测 '+left+' 次'):'验证成功，这是本码最后一次');
      closeCodeModal();startQuiz();
      return true;
    }
    if(!fromUrl){
      if(res.reason==='exhausted')toast('此验证码已用完（每个码限 3 次）');
      else toast('验证码不正确');
    }
    return false;
  }catch(e){
    console.error(e);
    if(!fromUrl)toast('网络异常，请稍后重试');
    return false;
  }finally{
    setCodeBusy(false);
  }
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrap(c,text,maxW){const out=[];let line='';for(const ch of text){if(c.measureText(line+ch).width>maxW&&line){out.push(line);line=ch;}else line+=ch;}if(line)out.push(line);return out;}
function buildShareCanvas(){

    if(doDraw){const g=c.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,'#F3EFFA');g.addColorStop(1,'#E9E3F5');c.fillStyle=g;c.fillRect(0,0,W,cv.height);}
    y=80;T('你的历史人物匹配结果',W/2,y,38,'#7B74B4',500,'center');y+=80;
    // card 1

    T(matchPct+'%',W/2,cy,190,'#7B74B4',700,'center');cy+=220;
    T(f.name,W/2,cy,96,'#2D2D5A',700,'center');cy+=125;
    T(f.subtitle,W/2,cy,38,'#6B6B7B',400,'center');cy+=80;
    c.font=`500 38px ${FONT}`;const tw=f.tags.map(t=>c.measureText(t).width+64);const tot=tw.reduce((a,b)=>a+b,0)+24*(tw.length-1);let tx=(W-tot)/2;
    f.tags.forEach((t,i)=>{if(doDraw){c.fillStyle='#F0EDF5';rr(c,tx,cy,tw[i],72,36);c.fill();}T(t,tx+tw[i]/2,cy+16,38,'#5A5490',500,'center');tx+=tw[i]+24;});cy+=104;
    c.font=`600 38px ${FONT}`;const dt='主导维度：'+f.dominant,dw=c.measureText(dt).width+80;
    if(doDraw){c.fillStyle='#E8E4F0';rr(c,(W-dw)/2,cy,dw,76,38);c.fill();}T(dt,W/2,cy+18,38,'#5A5490',600,'center');
    y=c1+H1+40;
    // quote
    c.font=`500 44px ${FONT}`;const ql=wrap(c,'“'+f.quote+'”',CW-96);const qh=110+ql.length*66+30;
    if(doDraw){c.fillStyle='#fff';rr(c,P,y,CW,qh,40);c.fill();c.strokeStyle='#D4CFE8';c.stroke();}
    T('人物心声',P+48,y+44,34,'#7B74B4',600);ql.forEach((l,i)=>T(l,P+48,y+104+i*66,44,'#2D2D5A',500));y+=qh+40;
    // bars
    const bh=140+DIMS.length*82;
    if(doDraw){c.fillStyle='#fff';rr(c,P,y,CW,bh,40);c.fill();c.strokeStyle='#D4CFE8';c.stroke();}
    T('八维能力结构',P+48,y+48,44,'#2D2D5A',700);
    DIMS.forEach((d,i)=>{const by=y+130+i*82,v=f.displayBars[d],bx=P+170,bw=CW-170-150;
      T(d,P+48,by,38,'#333340',500);
      if(doDraw){c.fillStyle='#E8E4F0';rr(c,bx,by+8,bw,28,14);c.fill();c.fillStyle='#8B84C0';rr(c,bx,by+8,bw*v/100,28,14);c.fill();}
      T(String(v),P+CW-48,by,38,'#7B74B4',600,'right');});
    y+=bh+40;
    // lines
    c.font=`500 40px ${FONT}`;const L=f.lines.map(l=>wrap(c,'“'+l+'”',CW-150));
    const lh=130+L.reduce((a,l)=>a+l.length*60+56,0);
    if(doDraw){c.fillStyle='#fff';rr(c,P,y,CW,lh,40);c.fill();c.strokeStyle='#D4CFE8';c.stroke();}
    T('你的三句人物台词',P+48,y+48,44,'#2D2D5A',700);let ly=y+130;
    L.forEach(ls=>{const h=ls.length*60+28;if(doDraw){c.fillStyle='#F0EDF5';rr(c,P+48,ly,CW-96,h,24);c.fill();}ls.forEach((t,i)=>T(t,P+78,ly+16+i*60,40,'#2D2D5A',500));ly+=h+28;});
